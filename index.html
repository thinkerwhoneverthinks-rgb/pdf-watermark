<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Daily Targets</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #ffffff);
            --text-color: var(--tg-theme-text-color, #000000);
            --hint-color: var(--tg-theme-hint-color, #999999);
            --link-color: var(--tg-theme-link-color, #2481cc);
            --button-color: var(--tg-theme-button-color, #2481cc);
            --button-text-color: var(--tg-theme-button-text-color, #ffffff);
            --secondary-bg-color: var(--tg-theme-secondary-bg-color, #f0f0f0);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
        }

        h2 {
            margin-top: 0;
            font-size: 20px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--hint-color);
        }

        select, input[type="text"], input[type="number"] {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--hint-color);
            border-radius: 8px;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-size: 16px;
            box-sizing: border-box;
            appearance: none;
            -webkit-appearance: none;
        }

        select:focus, input:focus {
            outline: none;
            border-color: var(--button-color);
        }

        .task-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .task-btn {
            background-color: var(--secondary-bg-color);
            color: var(--text-color);
            border: 1px solid transparent;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .task-btn.selected {
            background-color: var(--button-color);
            color: var(--button-text-color);
        }

        .dynamic-input {
            display: none;
            margin-top: 10px;
        }

        .dynamic-input.show {
            display: block;
        }

        .submit-btn {
            background-color: var(--button-color);
            color: var(--button-text-color);
            border: none;
            padding: 14px;
            width: 100%;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 24px;
        }
    </style>
</head>
<body>
    <h2>Add Target</h2>

    <div class="form-group">
        <label>Date</label>
        <select id="dateSelect">
            <option value="0">Today</option>
            <option value="1">Tomorrow</option>
            <option value="2">Day after tomorrow</option>
        </select>
    </div>

    <div class="form-group">
        <label>Subject</label>
        <select id="subject" onchange="handleSubjectChange()">
            <option value="Physics">Physics</option>
            <option value="Chemistry">Chemistry</option>
            <option value="Biology">Biology</option>
            <option value="Test">Test</option>
            <option value="Custom">Custom...</option>
        </select>
        <div id="customSubjectDiv" class="dynamic-input">
            <input type="text" id="customSubject" placeholder="Enter subject name">
        </div>
    </div>

    <div class="form-group">
        <label>Chapter / Topic Name (Optional)</label>
        <input type="text" id="chapter" placeholder="e.g. Thermodynamics, Solutions, etc.">
    </div>

    <div class="form-group">
        <label>Time Deadline (Optional)</label>
        <input type="text" id="timeDeadline" placeholder="e.g. Morning, Till 6 PM, 1-6">
    </div>

    <div class="form-group">
        <label>Task Type</label>
        <div class="task-grid">
            <div class="task-btn" onclick="selectTask('Lecture', this)">Lecture</div>
            <div class="task-btn" onclick="selectTask('Questions', this)">Questions</div>
            <div class="task-btn" onclick="selectTask('Revision', this)">Revision</div>
            <div class="task-btn" onclick="selectTask('Short Notes', this)">Short Notes</div>
            <div class="task-btn" onclick="selectTask('NCERT', this)">NCERT</div>
            <div class="task-btn" onclick="selectTask('Custom', this)">Custom...</div>
        </div>

        <div id="numberInputDiv" class="dynamic-input">
            <label id="numberLabel" style="margin-top: 8px;"></label>
            <input type="number" id="numberInput" min="1" value="1">
        </div>

        <div id="customTaskDiv" class="dynamic-input">
            <label style="margin-top: 8px;">Custom Task Details</label>
            <input type="text" id="customTask" placeholder="Enter task details">
        </div>
    </div>


    <div id="pendingTasksContainer" class="form-group" style="display: none; background: rgba(0,0,0,0.05); padding: 10px; border-radius: 8px;">
        <label>Targets to Add:</label>
        <ul id="pendingTasksList" style="margin: 5px 0; padding-left: 20px; font-size: 14px;"></ul>
    </div>

    <button class="submit-btn" style="background-color: #2ecc71; margin-bottom: 10px;" onclick="addTaskToList()">➕ Add Task to List</button>
    <button class="submit-btn" id="finalSubmitBtn" style="display: none;" onclick="submitData()">🚀 Send All Targets</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Notify telegram that app is ready
        tg.ready();

        // Set theme colors for UI adaptation if supported
        try {
            if (tg.themeParams.bg_color) {
                document.body.style.backgroundColor = tg.themeParams.bg_color;
            }
        } catch(e) {}

        let currentTaskType = null;

        function handleSubjectChange() {
            const subject = document.getElementById('subject').value;
            const customDiv = document.getElementById('customSubjectDiv');
            if (subject === 'Custom') {
                customDiv.classList.add('show');
            } else {
                customDiv.classList.remove('show');
            }
        }

        function selectTask(taskType, element) {
            // Remove selected class from all
            document.querySelectorAll('.task-btn').forEach(btn => btn.classList.remove('selected'));
            // Add to clicked
            element.classList.add('selected');
            currentTaskType = taskType;

            const numberDiv = document.getElementById('numberInputDiv');
            const customDiv = document.getElementById('customTaskDiv');
            const numberLabel = document.getElementById('numberLabel');

            numberDiv.classList.remove('show');
            customDiv.classList.remove('show');

            if (taskType === 'Lecture') {
                numberDiv.classList.add('show');
                numberLabel.innerText = 'Number of Lectures:';
                document.getElementById('numberInput').value = 1;
            } else if (taskType === 'Questions') {
                numberDiv.classList.add('show');
                numberLabel.innerText = 'Number of Questions:';
                document.getElementById('numberInput').value = 50;
            } else if (taskType === 'Custom') {
                customDiv.classList.add('show');
            }
        }


        let pendingTasks = [];

        function addTaskToList() {
            if (!currentTaskType) {
                tg.showAlert("Please select a task type.");
                return;
            }

            let subject = document.getElementById('subject').value;
            if (subject === 'Custom') {
                subject = document.getElementById('customSubject').value.trim();
                if (!subject) {
                    tg.showAlert("Please enter a custom subject.");
                    return;
                }
            }

            let chapter = document.getElementById('chapter').value.trim();
            let timeDeadline = document.getElementById('timeDeadline').value.trim();
            if (timeDeadline) {
                timeDeadline = "[" + timeDeadline + "]";
                chapter = chapter ? chapter + " " + timeDeadline : timeDeadline;
            }

            let taskObj = {
                subject: subject,
                chapter: chapter,
                type: currentTaskType,
            };

            if (currentTaskType === 'Lecture' || currentTaskType === 'Questions') {
                taskObj.count = parseInt(document.getElementById('numberInput').value) || 1;
            } else if (currentTaskType === 'Custom') {
                taskObj.details = document.getElementById('customTask').value.trim();
                if (!taskObj.details) {
                    tg.showAlert("Please enter custom task details.");
                    return;
                }
            }

            pendingTasks.push(taskObj);

            // Update UI
            document.getElementById('pendingTasksContainer').style.display = 'block';
            document.getElementById('finalSubmitBtn').style.display = 'block';

            let list = document.getElementById('pendingTasksList');
            let li = document.createElement('li');
            let taskDesc = taskObj.type;
            if (taskObj.count) taskDesc += " (" + taskObj.count + ")";
            if (taskObj.details) taskDesc = taskObj.details;

            li.innerText = subject + (chapter ? " - " + chapter : "") + ": " + taskDesc;
            list.appendChild(li);

            // Reset task selection but keep subject and chapter for fast entry
            document.querySelectorAll('.task-btn').forEach(btn => btn.classList.remove('selected'));
            currentTaskType = null;
            document.getElementById('numberInputDiv').classList.remove('show');
            document.getElementById('customTaskDiv').classList.remove('show');
            document.getElementById('customTask').value = '';
        }

        function submitData() {
            if (pendingTasks.length === 0) {
                tg.showAlert("Please add at least one task first.");
                return;
            }

            // We need to pass the date selector to the bot too.
            // We can prepend a special date configuration object to the array.
            let dateOffset = parseInt(document.getElementById('dateSelect').value) || 0;
            let payload = [{ __date_offset: dateOffset }].concat(pendingTasks);

            // Send data array back to the bot
            tg.sendData(JSON.stringify(payload));
            tg.close();
        }

    </script>
</body>
</html>
