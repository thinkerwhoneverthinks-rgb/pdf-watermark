<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Add Daily Target</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #ffffff);
            --text-color: var(--tg-theme-text-color, #222222);
            --button-color: var(--tg-theme-button-color, #2481cc);
            --button-text-color: var(--tg-theme-button-text-color, #ffffff);
            --secondary-bg-color: var(--tg-theme-secondary-bg-color, #f0f2f5);
            --hint-color: var(--tg-theme-hint-color, #999999);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            user-select: none;
            -webkit-user-select: none;
        }

        h2 {
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 20px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 500;
            color: var(--hint-color);
        }

        select, input[type="text"], input[type="number"], input[type="date"] {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--secondary-bg-color);
            background-color: var(--secondary-bg-color);
            color: var(--text-color);
            font-size: 16px;
            box-sizing: border-box;
            appearance: none;
            -webkit-appearance: none;
        }

        select:focus, input:focus {
            outline: none;
            border-color: var(--button-color);
        }

        .pill-grid {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            scrollbar-width: none;
            padding-bottom: 4px;
        }
        .pill-grid::-webkit-scrollbar {
            display: none;
        }

        .pill-btn {
            background-color: var(--secondary-bg-color);
            color: var(--text-color);
            border: 1px solid transparent;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .pill-btn.selected {
            background-color: var(--button-color);
            color: var(--button-text-color);
            font-weight: 600;
        }

        .task-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .task-btn {
            background-color: var(--secondary-bg-color);
            color: var(--text-color);
            border: 1px solid transparent;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .task-btn.selected {
            background-color: var(--button-color);
            color: var(--button-text-color);
            font-weight: 600;
        }

        .dynamic-input {
            display: none;
            margin-top: 10px;
        }

        .dynamic-input.show {
            display: block;
        }

        .submit-btn {
            background-color: var(--button-color);
            color: var(--button-text-color);
            border: none;
            padding: 14px;
            width: 100%;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 16px;
        }
    </style>
</head>
<body>
    <h2>Add Target</h2>

    <!-- Target Date Section -->
    <div class="form-group">
        <label>Target Date</label>
        <div class="pill-grid" id="datePillGrid">
            <div class="pill-btn selected" onclick="selectDateOption('today', this)">📅 Today</div>
            <div class="pill-btn" onclick="selectDateOption('tomorrow', this)">🌅 Tomorrow</div>
            <div class="pill-btn" onclick="selectDateOption('custom', this)">📆 Custom Date</div>
        </div>
        <div id="customDateDiv" class="dynamic-input">
            <input type="date" id="customDateInput">
        </div>
    </div>

    <!-- Subject Selection -->
    <div class="form-group">
        <label>Subject</label>
        <select id="subject" onchange="handleSubjectChange()">
            <option value="Physics">Physics</option>
            <option value="Chemistry">Chemistry</option>
            <option value="Biology">Biology</option>
            <option value="Test">Test</option>
            <option value="Custom">Custom...</option>
        </select>
        <div id="customSubjectDiv" class="dynamic-input">
            <input type="text" id="customSubject" placeholder="Enter subject name">
        </div>
    </div>

    <!-- Chapter / Topic -->
    <div class="form-group">
        <label>Chapter / Topic Name (Optional)</label>
        <input type="text" id="chapter" placeholder="e.g. Thermodynamics, Solutions, etc.">
    </div>

    <!-- Task Type -->
    <div class="form-group">
        <label>Task Type</label>
        <div class="task-grid">
            <div class="task-btn" onclick="selectTask('Lecture', this)">Lecture</div>
            <div class="task-btn" onclick="selectTask('Questions', this)">Questions</div>
            <div class="task-btn" onclick="selectTask('Revision', this)">Revision</div>
            <div class="task-btn" onclick="selectTask('Short Notes', this)">Short Notes</div>
            <div class="task-btn" onclick="selectTask('NCERT', this)">NCERT</div>
            <div class="task-btn" onclick="selectTask('Custom', this)">Custom...</div>
        </div>

        <div id="numberInputDiv" class="dynamic-input">
            <label id="numberLabel" style="margin-top: 8px;"></label>
            <input type="number" id="numberInput" min="1" value="1">
        </div>

        <div id="customTaskDiv" class="dynamic-input">
            <label style="margin-top: 8px;">Custom Task Details</label>
            <input type="text" id="customTask" placeholder="Enter task details">
        </div>
    </div>

    <!-- Time Slot / Deadline (Optional) -->
    <div class="form-group">
        <label>Time Slot / Deadline (Optional)</label>
        <div class="pill-grid" id="timePillGrid">
            <div class="pill-btn selected" onclick="selectTimeSlot('', this)">❌ None</div>
            <div class="pill-btn" onclick="selectTimeSlot('Morning', this)">🌅 Morning</div>
            <div class="pill-btn" onclick="selectTimeSlot('Afternoon', this)">☀️ Afternoon</div>
            <div class="pill-btn" onclick="selectTimeSlot('Evening', this)">🌆 Evening</div>
            <div class="pill-btn" onclick="selectTimeSlot('Night', this)">🌙 Night</div>
            <div class="pill-btn" onclick="selectTimeSlot('Custom', this)">⏰ Custom...</div>
        </div>
        <div id="customTimeDiv" class="dynamic-input">
            <input type="text" id="customTimeInput" placeholder="e.g. 1-6 PM, till 6, by 10 PM">
        </div>
    </div>

    <!-- Pending Tasks Preview -->
    <div id="pendingTasksContainer" class="form-group" style="display: none; background: rgba(0,0,0,0.05); padding: 12px; border-radius: 8px;">
        <label style="color: var(--text-color); font-weight: 600;">Targets to Add:</label>
        <ul id="pendingTasksList" style="margin: 6px 0; padding-left: 20px; font-size: 14px; line-height: 1.6;"></ul>
    </div>

    <button class="submit-btn" style="background-color: #2ecc71; margin-bottom: 10px;" onclick="addTaskToList()">➕ Add Task to List</button>
    <button class="submit-btn" id="finalSubmitBtn" style="display: none;" onclick="submitData()">🚀 Send All Targets</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        try {
            if (tg.themeParams.bg_color) {
                document.body.style.backgroundColor = tg.themeParams.bg_color;
            }
        } catch(e) {}

        let currentDateOption = 'today';
        let currentTimeSlot = '';
        let currentTaskType = null;
        let pendingTasks = [];

        function selectDateOption(option, element) {
            document.querySelectorAll('#datePillGrid .pill-btn').forEach(btn => btn.classList.remove('selected'));
            element.classList.add('selected');
            currentDateOption = option;

            const customDiv = document.getElementById('customDateDiv');
            if (option === 'custom') {
                customDiv.classList.add('show');
                const today = new Date();
                const yyyy = today.getFullYear();
                const mm = String(today.getMonth() + 1).padStart(2, '0');
                const dd = String(today.getDate()).padStart(2, '0');
                document.getElementById('customDateInput').value = `${yyyy}-${mm}-${dd}`;
            } else {
                customDiv.classList.remove('show');
            }
        }

        function selectTimeSlot(slot, element) {
            document.querySelectorAll('#timePillGrid .pill-btn').forEach(btn => btn.classList.remove('selected'));
            element.classList.add('selected');

            const customDiv = document.getElementById('customTimeDiv');
            if (slot === 'Custom') {
                currentTimeSlot = 'Custom';
                customDiv.classList.add('show');
            } else {
                currentTimeSlot = slot;
                customDiv.classList.remove('show');
            }
        }

        function handleSubjectChange() {
            const subject = document.getElementById('subject').value;
            const customDiv = document.getElementById('customSubjectDiv');
            if (subject === 'Custom') {
                customDiv.classList.add('show');
            } else {
                customDiv.classList.remove('show');
            }
        }

        function selectTask(taskType, element) {
            document.querySelectorAll('.task-btn').forEach(btn => btn.classList.remove('selected'));
            element.classList.add('selected');
            currentTaskType = taskType;

            const numberDiv = document.getElementById('numberInputDiv');
            const customDiv = document.getElementById('customTaskDiv');
            const numberLabel = document.getElementById('numberLabel');

            numberDiv.classList.remove('show');
            customDiv.classList.remove('show');

            if (taskType === 'Lecture') {
                numberDiv.classList.add('show');
                numberLabel.innerText = 'Number of Lectures:';
                document.getElementById('numberInput').value = 1;
            } else if (taskType === 'Questions') {
                numberDiv.classList.add('show');
                numberLabel.innerText = 'Number of Questions:';
                document.getElementById('numberInput').value = 50;
            } else if (taskType === 'Custom') {
                customDiv.classList.add('show');
            }
        }

        function addTaskToList() {
            if (!currentTaskType) {
                tg.showAlert("Please select a task type.");
                return;
            }

            let subject = document.getElementById('subject').value;
            if (subject === 'Custom') {
                subject = document.getElementById('customSubject').value.trim();
                if (!subject) {
                    tg.showAlert("Please enter a custom subject.");
                    return;
                }
            }

            let chapter = document.getElementById('chapter').value.trim();

            let timeSlot = currentTimeSlot;
            if (timeSlot === 'Custom') {
                timeSlot = document.getElementById('customTimeInput').value.trim();
            }

            let taskObj = {
                subject: subject,
                chapter: chapter,
                type: currentTaskType,
                time_slot: timeSlot,
            };

            if (currentTaskType === 'Lecture' || currentTaskType === 'Questions') {
                taskObj.count = parseInt(document.getElementById('numberInput').value) || 1;
            } else if (currentTaskType === 'Custom') {
                taskObj.details = document.getElementById('customTask').value.trim();
                if (!taskObj.details) {
                    tg.showAlert("Please enter custom task details.");
                    return;
                }
            }

            pendingTasks.push(taskObj);

            // Update UI list
            document.getElementById('pendingTasksContainer').style.display = 'block';
            document.getElementById('finalSubmitBtn').style.display = 'block';

            let list = document.getElementById('pendingTasksList');
            let li = document.createElement('li');
            let taskDesc = taskObj.type;
            if (taskObj.count) taskDesc += " (" + taskObj.count + ")";
            if (taskObj.details) taskDesc = taskObj.details;
            let timeBadge = timeSlot ? " [⏰ " + timeSlot + "]" : "";

            li.innerText = subject + (chapter ? " - " + chapter : "") + ": " + taskDesc + timeBadge;
            list.appendChild(li);

            // Reset task type selection for rapid next entry
            document.querySelectorAll('.task-btn').forEach(btn => btn.classList.remove('selected'));
            currentTaskType = null;
            document.getElementById('numberInputDiv').classList.remove('show');
            document.getElementById('customTaskDiv').classList.remove('show');
            document.getElementById('customTask').value = '';
        }

        function submitData() {
            if (pendingTasks.length === 0) {
                tg.showAlert("Please add at least one task first.");
                return;
            }

            let resolvedDate = "";
            let now = new Date();
            if (currentDateOption === 'today') {
                const yyyy = now.getFullYear();
                const mm = String(now.getMonth() + 1).padStart(2, '0');
                const dd = String(now.getDate()).padStart(2, '0');
                resolvedDate = `${yyyy}-${mm}-${dd}`;
            } else if (currentDateOption === 'tomorrow') {
                now.setDate(now.getDate() + 1);
                const yyyy = now.getFullYear();
                const mm = String(now.getMonth() + 1).padStart(2, '0');
                const dd = String(now.getDate()).padStart(2, '0');
                resolvedDate = `${yyyy}-${mm}-${dd}`;
            } else if (currentDateOption === 'custom') {
                resolvedDate = document.getElementById('customDateInput').value;
            }

            let payload = {
                date: resolvedDate,
                tasks: pendingTasks
            };

            tg.sendData(JSON.stringify(payload));
            tg.close();
        }
    </script>
</body>
</html>
